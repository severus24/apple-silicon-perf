<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Mac 芯片性能排行 · Geekbench</title>
<link rel="icon" href="logo.jpg">
<style>
:root{
  --bg:#050506; --panel:#0d0d0f; --line:#26262b; --text:#f5f6f8; --muted:#9b9ba4;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
header.site{position:sticky;top:0;z-index:20;background:rgba(5,5,6,.86);backdrop-filter:blur(14px);border-bottom:1px solid #1d1d21}
.head-row{display:flex;align-items:center;gap:14px;padding:12px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-size:14px;letter-spacing:.08em;color:#d8d9dd;font-weight:600}
.brand .logo{width:30px;height:30px;border:1px solid #35353b;border-radius:8px;display:grid;place-items:center;color:#7ee8c8}
.head-meta{margin-left:auto;font-size:12px;color:#77777f;text-align:right;line-height:1.5}
.page-head{padding:34px 0 10px}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(26px,4vw,46px);font-weight:800;line-height:1.1;letter-spacing:.02em}
h1 .accent{background:linear-gradient(90deg,#01d2ff,#3a7cd6);-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{margin:8px 0 0;color:#8c8c94;font-size:13px;line-height:1.6}
.notice{margin:16px 0 0;color:#d9d9de;font-size:13px;line-height:1.6;padding:10px 14px;border:1px solid #26262b;border-radius:10px;background:rgba(255,255,255,.03)}
.notice b{color:#fff}
.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:22px 0 8px}
.modes{display:flex;gap:8px;flex-wrap:wrap}
.mode{font-size:14px;font-weight:700;padding:9px 18px;border-radius:999px;border:2px solid #48484f;color:#c9c9cf;transition:.2s;background:rgba(0,0,0,.35)}
.mode.active{background:var(--accent);border-color:var(--accent);color:#000}
.mode:not(.active):hover{background:#2a2a30}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;background:#101013;border:1px solid #2d2d33;border-radius:999px;padding:6px 14px;min-width:230px;flex:1 1 240px}
.search svg{width:15px;height:15px;color:#77777f;flex:none}
.search input{flex:1;background:none;border:0;outline:0;color:#eee;font-size:13px;min-width:0}
.selects{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:12px;font-weight:600;padding:7px 13px;border-radius:999px;border:1px solid #333;color:#c4c4cb;background:#0e0e11;transition:.15s;white-space:nowrap}
.pill:hover{border-color:#666}
.pill.active{background:#232329;border-color:#5b5b64;color:#fff}
.range{display:flex;align-items:center;gap:8px;font-size:12px;color:#9a9aa3}
.range input{width:110px;accent-color:var(--accent,#01d2ff)}
.score-table{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0 30px}
.score-table th{font-size:11px;color:#6d6d75;text-transform:uppercase;letter-spacing:.12em;font-weight:600;text-align:left;padding:8px 6px;border-bottom:1px solid #26262b;background:#0a0a0c;position:sticky;top:60px;z-index:5}
.score-table th.chart-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.score-table th .mode-count{margin-left:auto;font-size:11px;color:#9a9aa3;text-transform:none;letter-spacing:0;font-weight:500}
.score-table tbody tr{border-bottom:1px solid #161619;transition:background .15s;cursor:pointer}
.score-table tbody tr:hover{background:#121216}
.score-table tbody tr.compare-pin{background:#12151f}
td.name{width:36%;min-width:280px;padding:10px 8px;vertical-align:middle}
.name-top{display:flex;align-items:center;gap:10px}
.name-top svg{flex:none;width:26px;height:26px}
.name-top > div{flex:1;min-width:0}
.rank{font-size:13px;color:#56565e;min-width:34px;font-variant-numeric:tabular-nums}
.device{font-weight:700;font-size:14px;color:#f1f2f5;line-height:1.35}
.chip-model{font-size:12px;color:#a3a3ac;margin-top:3px;line-height:1.45;display:block}
.chip-model b{color:#cfcfd6;font-weight:600}
.chip-summary{display:inline;cursor:pointer;color:#a3a3ac}
.chip-summary:hover{color:#e6e6ec;text-decoration:underline}
.chip-summary b{color:#cfcfd6;font-weight:600}
.chip-model{display:flex;flex-wrap:wrap;align-items:baseline}
.chip-summary{cursor:default}
.chip-summary:hover{color:#a3a3ac;text-decoration:none}
.expander{display:inline-grid;place-items:center;width:18px;height:18px;margin-left:6px;padding:0;border:1px solid #3a3a42;border-radius:50%;font-size:10px;line-height:1;color:#b9b9c0;background:#15151a;transition:.18s;cursor:pointer;vertical-align:baseline;flex:none}
.summary-tail{white-space:nowrap}
.chip-summary b{color:#cfcfd6;font-weight:600}
.expander:hover{color:#fff;border-color:#5a5a66;background:#1d1d24}
.expander svg{transition:transform .2s}
.expander.open{color:#fff;border-color:var(--accent);background:rgba(255,255,255,.06)}
.expander.open svg{transform:rotate(180deg)}
.dev-full{display:block;margin-top:6px;padding:8px 10px 9px;border-left:2px solid #3a3a42;background:#0d0d10;font-size:11px;color:#9b9ba4;line-height:1.65}
.dev-full .dev-label{font-size:10px;color:#67676f;letter-spacing:.08em}
.dev-full .dev-item{display:block;color:#c8c8cf}
.dev-full .dev-item+.dev-item{margin-top:1px}
.cmp-hint{margin-left:auto;font-size:11px;color:#56565e;white-space:nowrap}
.compare-pin .cmp-hint{color:#7ee8c8}
td.chart{width:64%;padding:0 8px;position:relative}
.axis-ticks{position:absolute;left:8px;right:112px;top:0;height:100%;pointer-events:none}
.tick{position:absolute;top:0;height:100%;border-left:1px dashed #24242a;color:#4d4d55;font-size:11px;padding-left:5px}
.bar-wrap{position:relative;height:34px;margin-right:104px}
.bar{height:20px;border-radius:0 12px 12px 0;position:absolute;top:7px;left:0;min-width:1px;background:linear-gradient(90deg,var(--barA,#01d2ff),var(--barB,#3a7cd6));opacity:1;transform:none;transition:width .6s cubic-bezier(.2,.82,.25,1),opacity .2s,transform .2s;box-shadow:0 0 14px rgba(0,120,255,.18);animation:barIn .6s cubic-bezier(.2,.82,.25,1)}
@keyframes barIn{from{opacity:0;transform:translateX(-2px)}to{opacity:.95;transform:none}}
.bar.anim{opacity:.95;transform:none;animation:none}
.bar .score{position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);white-space:nowrap;font-weight:800;font-size:14px;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 1px 8px rgba(0,0,0,.55)}
.spec{font-size:11px;color:#66666e;margin-top:3px;font-variant-numeric:tabular-nums}
.none{color:#3c3c44;font-weight:500}
footer{background:#0b0b0d;border-top:1px solid #1d1d21;padding:26px 0;margin-top:30px}
footer .foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12px;color:#66666e;line-height:1.7}
.drawer{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(10,10,12,.97);border-top:1px solid #303036;box-shadow:0 -20px 60px rgba(0,0,0,.6);transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.82,.25,1)}
.drawer.open{transform:none}
.drawer-inner{max-width:1320px;margin:0 auto;padding:14px 20px 18px}
.drawer-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.drawer-head h3{margin:0;font-size:15px}
.drawer-head span{font-size:12px;color:#777}
.drawer-actions{margin-left:auto;display:flex;gap:8px}
.compare-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.cmp-card{background:#151518;border:1px solid #2b2b31;border-radius:10px;padding:12px}
.cmp-card .cmp-name{font-weight:700;font-size:13px;line-height:1.35}
.cmp-card .cmp-chip{font-size:11px;color:#999;margin-top:3px}
.cmp-row{margin-top:10px}
.cmp-row .label{font-size:10px;color:#777;margin-bottom:4px;display:flex;justify-content:space-between}
.cmp-row .label .cmp-rank{font-weight:800;margin-right:5px}
.cmp-row .lbar{height:7px;background:#222;border-radius:4px;overflow:hidden}
.cmp-row .lfill{height:100%;border-radius:4px}
.btn{border:1px solid #44444c;border-radius:999px;padding:8px 15px;font-size:12px;font-weight:700;transition:.15s;background:#141417;color:#ddd}
.btn:hover{border-color:#777}
.float{position:fixed;bottom:24px;right:24px;z-index:15}
.float .btn{font-size:13px;padding:12px 18px;background:#1b1b20;box-shadow:0 8px 24px rgba(0,0,0,.4)}
@media (max-width:900px){
  .head-row{gap:8px}
  .head-meta{display:none}
  .page-head{padding:22px 0 4px}
  .controls{gap:8px;margin:16px 0 4px}
  .mode{padding:7px 13px;font-size:13px}
  td.name{width:52%;min-width:0}
  td.chart{width:48%;padding:0 6px}
  .device{font-size:13px}
  .chip-model{font-size:11px}
  .rank{min-width:26px;font-size:11px}
  .cmp-hint{display:none}
  .bar .score{font-size:11px;left:calc(100% + 6px)}
  .bar-wrap{height:30px;margin-right:64px}
  .axis-ticks{left:6px;right:70px}
  .bar{height:16px}
  .search{min-width:0;width:100%}
  .selects{width:100%}
  .range input{width:90px}
  .float{bottom:16px;right:16px}
}
</style>
</head>

function deviceIcon(device, color){
  const key=/MacBook/.test(device)?'MacBook':/Mac mini/.test(device)?'Mac mini':/iMac/.test(device)?'iMac':/Mac Studio/.test(device)?'Mac Studio':/Mac Pro/.test(device)?'Mac Pro':'Chip';
  const paths=HICONS[key]||HICONS.Chip;
  return '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="'+color+'" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+paths.map(d=>'<path d="'+d+'"/>').join('')+'</svg>';
}
function rowMatches(r,q){ return (r.label+' '+r.chip+' '+r.devices.join(' ')).toLowerCase().includes(q); }
function inFamily(r,fam){ return r.devices.some(d=>familyOf(d)===fam); }
function rowsFor(){
  let rows=DATA[mode];
  const q=($('search').value||'').trim().toLowerCase();
  if(q) rows=rows.filter(r=>rowMatches(r,q));
  if(family!=='all') rows=rows.filter(r=>inFamily(r,family));
  return [...rows].sort((a,b)=>(b.score||0)-(a.score||0));
}
function axisTicks(modeDef){
  return [0,1,2,3,4].map(t=>{
    const left=t*25;
    const val=Math.round(modeDef.max*t/4);
    return '<span class="tick" style="left:'+left+'%">'+fmt(val)+'</span>';
  }).join('');
}
function chipSummary(r){
  const multi=r.devices.length>1;
  const summary=esc(r.chip)+' · '+esc(r.devices[0]||r.chip);
  if(!multi) return summary;
  const isOpen=expanded.has(r.key);
  const chevron='<svg viewBox="0 0 16 16" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l5 5 5-5"/></svg>';
  return '<span class="chip-summary">'+summary+'<span class="summary-tail"> 等 '+r.devices.length+' 款<button type="button" class="expander'+(isOpen?' open':'')+'" title="查看全部机型">'+chevron+'</button></span></span>'+(isOpen?'<span class="dev-full"><span class="dev-label">来源机型</span>'+r.devices.map(d=>'<span class="dev-item">'+esc(d)+'</span>').join('')+'</span>':'');
}
function toggleDevices(r,summaryEl){
  const open=expanded.has(r.key);
  if(open) expanded.delete(r.key); else expanded.add(r.key);
  const parent=summaryEl.parentElement;
  parent.querySelectorAll('.dev-full').forEach(el=>el.remove());
  const newOpen=!open;
  const btn=summaryEl.querySelector('.expander');
  if(btn) btn.classList.toggle('open',newOpen);
  if(!open){
    const full=document.createElement('span'); full.className='dev-full';
    full.innerHTML='<span class="dev-label">来源机型</span>'+r.devices.map(d=>'<span class="dev-item">'+esc(d)+'</span>').join('');
    parent.appendChild(full);
  }
}
function render(){
  const rows=rowsFor();
  const top=+($('topN').value||75);
  const shown=rows.slice(0,top);
  state.rows=rows.length;
  const modeDef=MODES[mode];
  $('modeCount').textContent='共 '+DATA[mode].length+' 款芯片配置';
  document.documentElement.style.setProperty('--accent',modeDef.color);
  const acc=$('titleAccent'); acc.style.background='linear-gradient(90deg,'+modeDef.color+','+modeDef.colorB+')'; acc.style.webkitBackgroundClip='text'; acc.style.backgroundClip='text';
  const modesBox=$('modes');
  modesBox.innerHTML='';
  Object.keys(MODES).forEach(k=>{
    const b=document.createElement('button');
    b.className='mode'+(k===mode?' active':'');
    b.textContent=MODES[k].label;
    b.style.setProperty('--accent',MODES[k].color);
    b.onclick=()=>{mode=k; render();};
    modesBox.appendChild(b);
  });
  document.querySelectorAll('.pill[data-family]').forEach(p=>{p.classList.toggle('active',p.dataset.family===family);});
  const tbody=$('rankBody'); tbody.innerHTML='';
  shown.forEach((r,i)=>{
    const tr=document.createElement('tr');
    tr.className=compare.has(r.key)?'compare-pin':'';
    const primary=r.devices[0]||r.chip;
    const color=devColor(primary,r.chip);
    const nameCell=document.createElement('td'); nameCell.className='name';
    nameCell.innerHTML='<div class="name-top"><span class="rank">#'+(i+1)+'</span>'+deviceIcon(primary,color)+'<div><div class="device">'+esc(r.label)+'</div><div class="chip-model" data-key="'+esc(r.key)+'">'+chipSummary(r)+'</div></div><span class="cmp-hint">'+(compare.has(r.key)?'已加入':'对比')+'</span></div>';
    nameCell.title='来源机型：'+r.devices.join('、');
    const barCell=document.createElement('td'); barCell.className='chart';
    const pct=Math.max(0.4,Math.min(100,(r.score||0)/modeDef.max*100));
    barCell.innerHTML='<div class="axis-ticks">'+axisTicks(modeDef)+'</div><div class="bar-wrap"><div class="bar" style="--barA:'+modeDef.color+';--barB:'+modeDef.colorB+';width:'+pct+'%"><span class="score">'+fmt(r.score)+'</span></div></div>';
    tr.appendChild(nameCell); tr.appendChild(barCell);
    tr.onclick=()=>{toggleCmp(r);};
    tbody.appendChild(tr);
    requestAnimationFrame(()=>{const bar=tr.querySelector('.bar-wrap .bar'); if(bar) setTimeout(()=>bar.classList.add('anim'), i%8*18);});
  });
  $('topNLabel').textContent=shown.length>=rows.length?('全部 '+rows.length):('前 '+shown.length+' / '+rows.length);
  renderCmp();
}
$('rankBody').addEventListener('click',e=>{ window.__d=(window.__d||0)+1; window.__dl=(window.__dl||[]); window.__dl.push('handler fires #'+window.__d+' target='+e.target.tagName+'.'+e.target.className);
  if(e.target.closest('.dev-full')) return;
  const summary=e.target.closest('.chip-summary');
  if(!summary) return;
  e.preventDefault(); e.stopPropagation();
  const tr=summary.closest('tr');
  const cell=tr&&tr.querySelector('.chip-model');
  const row=cell&&byMode[mode][cell.dataset.key];
  if(row) toggleDevices(row,summary);
});
function deviceCountText(r){ return r.devices.length>1?(esc(r.devices[0])+' 等 '+r.devices.length+' 款'):esc(r.devices[0]||r.chip); }
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function keyOf(r){return r.key;}
function toggleCmp(r){
  const k=keyOf(r);
  if(compare.has(k)) compare.delete(k); else { if(compare.size>=6) compare.delete([...compare][0]); compare.add(k); }
  render();
  $('drawer').classList.toggle('open',compare.size>0);
}
function renderCmp(){
  const grid=$('cmpGrid'); grid.innerHTML='';
  const rows=[...compare].map(k=>ALL.get(k)).filter(Boolean);
  $('cmpCount').textContent=rows.length?('已选择 '+rows.length+' 款芯片配置，点击排行中的行可增减'):'点击排行中的行，将芯片配置加入对比';
  rows.forEach(r=>{
    const card=document.createElement('div'); card.className='cmp-card';
    card.title='来源机型：'+r.devices.join('、');
    let inner='<div class="cmp-name">'+esc(r.label)+'</div><div class="cmp-chip">'+esc(r.chip)+' · '+deviceCountText(r)+'</div>';
    Object.keys(MODES).forEach(k=>{
      const row=byMode[k][r.key];
      const score=row?row.score:null;
      const rank=row?RANK[k][r.key]:null;
      const pct=score?Math.max(1,Math.min(100,score/MODES[k].max*100)):0;
      inner+='<div class="cmp-row"><div class="label"><span>'+MODES[k].label+'</span><span>'+(rank?'<span class="cmp-rank" style="color:'+MODES[k].color+'">#'+rank+'</span> ':'')+fmt(score)+'</span></div><div class="lbar"><div class="lfill" style="width:'+pct+'%;background:'+MODES[k].color+'"></div></div></div>';
    });
    card.innerHTML=inner; grid.appendChild(card);
  });
}
$('search').addEventListener('input',()=>render());
$('topN').addEventListener('input',()=>render());
document.querySelectorAll('.pill[data-family]').forEach(p=>p.addEventListener('click',()=>{family=p.dataset.family;render();}));
$('clearCmp').onclick=()=>{compare.clear();render();$('drawer').classList.remove('open');};
$('closeDrawer').onclick=()=>$('drawer').classList.remove('open');
$('saveBtn').onclick=async()=>{
  const btn=$('saveBtn'); btn.textContent='生成中...';
  try{
    const mod=await import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.esm.js');
    const html2canvas=mod.default||window.html2canvas;
    if(typeof html2canvas!=='function') throw new Error('html2canvas 加载失败');
    const el=document.querySelector('.table-scroll');
    const canvas=await html2canvas(el,{backgroundColor:'#050506',scale:2,useCORS:true});
    const a=document.createElement('a'); a.download='Mac芯片性能排行-'+MODES[mode].label+'.png'; a.href=canvas.toDataURL('image/png'); a.click();
  }catch(e){alert('保存失败：'+e.message);}
  btn.textContent='保存图片';
};
render();
</script>
